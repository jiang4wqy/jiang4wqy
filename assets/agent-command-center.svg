<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Jiang Agent Systems animated command center</title>
  <desc id="desc">A neon AI agent command center with a scanning grid, pulsing core, connected model, MCP, tools and evaluation nodes, and flowing data packets.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1b" />
      <stop offset="0.5" stop-color="#11123a" />
      <stop offset="1" stop-color="#071d2b" />
    </linearGradient>
    <linearGradient id="titleGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc" />
      <stop offset="0.5" stop-color="#c084fc" />
      <stop offset="1" stop-color="#22d3ee" />
    </linearGradient>
    <radialGradient id="coreGradient">
      <stop offset="0" stop-color="#f0abfc" />
      <stop offset="0.45" stop-color="#8b5cf6" />
      <stop offset="1" stop-color="#0e7490" />
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#38bdf8" stroke-opacity="0.1" stroke-width="1" />
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <path id="modelFlow" d="M 810 83 C 850 95 875 115 895 138" />
    <path id="mcpFlow" d="M 1042 98 C 1015 112 990 127 970 145" />
    <path id="toolFlow" d="M 808 245 C 852 232 880 210 900 186" />
    <path id="evalFlow" d="M 1040 240 C 1005 225 985 205 968 182" />
  </defs>
  <style>
    .scan { animation: scan 5s linear infinite; }
    .dash { stroke-dasharray: 7 12; animation: dash 2.4s linear infinite; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.2s ease-in-out infinite; }
    .pulse-delayed { transform-box: fill-box; transform-origin: center; animation: pulse 2.2s 1.1s ease-in-out infinite; }
    .blink { animation: blink 1.5s ease-in-out infinite; }
    .star-a { animation: twinkle 2.8s ease-in-out infinite; }
    .star-b { animation: twinkle 3.6s 1.1s ease-in-out infinite; }
    .star-c { animation: twinkle 4.1s 2s ease-in-out infinite; }
    .ticker { animation: ticker 3.4s ease-in-out infinite; }
    @keyframes scan { from { transform: translateY(-24px); } to { transform: translateY(344px); } }
    @keyframes dash { to { stroke-dashoffset: -38; } }
    @keyframes pulse { 0%,100% { transform: scale(0.92); opacity: 0.55; } 50% { transform: scale(1.12); opacity: 1; } }
    @keyframes blink { 0%,100% { opacity: 0.28; } 50% { opacity: 1; } }
    @keyframes twinkle { 0%,100% { opacity: 0.2; } 50% { opacity: 0.95; } }
    @keyframes ticker { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .scan,.dash,.pulse,.pulse-delayed,.blink,.star-a,.star-b,.star-c,.ticker { animation: none; }
    }
  </style>

  <rect width="1200" height="320" rx="22" fill="url(#background)" />
  <rect width="1200" height="320" rx="22" fill="url(#grid)" />
  <path d="M0 265 C220 215 400 330 610 272 S990 215 1200 270 V320 H0Z" fill="#7c3aed" opacity="0.08" />
  <path d="M0 285 C230 240 455 330 680 278 S1010 242 1200 290 V320 H0Z" fill="#06b6d4" opacity="0.09" />

  <g fill="#7dd3fc">
    <circle class="star-a" cx="76" cy="46" r="1.8" />
    <circle class="star-b" cx="192" cy="77" r="1.3" />
    <circle class="star-c" cx="336" cy="40" r="1.7" />
    <circle class="star-a" cx="472" cy="86" r="1.2" />
    <circle class="star-c" cx="615" cy="44" r="1.5" />
    <circle class="star-b" cx="724" cy="65" r="1.9" />
    <circle class="star-a" cx="1095" cy="45" r="1.4" />
    <circle class="star-c" cx="1142" cy="168" r="1.8" />
    <circle class="star-b" cx="690" cy="274" r="1.4" />
    <circle class="star-a" cx="390" cy="256" r="1.6" />
    <circle class="star-c" cx="130" cy="238" r="1.3" />
  </g>

  <rect class="scan" x="0" y="0" width="1200" height="3" fill="#67e8f9" opacity="0.34" filter="url(#softGlow)" />

  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="74" y="74" fill="#67e8f9" font-size="14" letter-spacing="4">NEON AGENT ARCADE // ONLINE</text>
    <text x="72" y="136" fill="url(#titleGradient)" font-size="48" font-weight="700" letter-spacing="2" filter="url(#softGlow)">JIANG / AGENT SYSTEMS</text>
    <text x="75" y="173" fill="#cbd5e1" font-size="20" letter-spacing="1.2">AI Agent Developer · Open-Source Builder</text>
    <text x="75" y="211" fill="#94a3b8" font-size="15">Reliable workflows  /  Evaluation  /  MCP  /  Developer tooling</text>

    <g transform="translate(75 246)">
      <rect width="148" height="32" rx="16" fill="#10213e" stroke="#38bdf8" stroke-opacity="0.5" />
      <circle class="blink" cx="18" cy="16" r="5" fill="#22d3ee" filter="url(#softGlow)" />
      <text x="34" y="21" fill="#bae6fd" font-size="13" letter-spacing="1.4">SYSTEM ONLINE</text>
    </g>
    <text class="ticker" x="248" y="267" fill="#a78bfa" font-size="13" letter-spacing="2.5">MODELS · MCP · TOOLS · EVALS · OSS</text>
  </g>

  <g fill="none" stroke="#67e8f9" stroke-width="2" opacity="0.65">
    <use class="dash" href="#modelFlow" />
    <use class="dash" href="#mcpFlow" />
    <use class="dash" href="#toolFlow" />
    <use class="dash" href="#evalFlow" />
  </g>

  <g fill="#e879f9" filter="url(#glow)">
    <circle r="4"><animateMotion dur="2.5s" repeatCount="indefinite"><mpath href="#modelFlow" /></animateMotion></circle>
    <circle r="4"><animateMotion dur="2.9s" begin="-1.2s" repeatCount="indefinite"><mpath href="#mcpFlow" /></animateMotion></circle>
    <circle r="4"><animateMotion dur="2.7s" begin="-0.8s" repeatCount="indefinite"><mpath href="#toolFlow" /></animateMotion></circle>
    <circle r="4"><animateMotion dur="3.1s" begin="-1.8s" repeatCount="indefinite"><mpath href="#evalFlow" /></animateMotion></circle>
  </g>

  <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
    <g transform="translate(780 55)">
      <rect width="118" height="48" rx="12" fill="#111d3b" stroke="#60a5fa" stroke-opacity="0.72" />
      <circle class="pulse" cx="20" cy="24" r="7" fill="#60a5fa" />
      <text x="72" y="29" fill="#dbeafe" font-size="14" letter-spacing="1.2">MODELS</text>
    </g>
    <g transform="translate(1032 68)">
      <rect width="112" height="48" rx="12" fill="#102837" stroke="#22d3ee" stroke-opacity="0.72" />
      <circle class="pulse-delayed" cx="20" cy="24" r="7" fill="#22d3ee" />
      <text x="68" y="29" fill="#cffafe" font-size="14" letter-spacing="1.2">MCP</text>
    </g>
    <g transform="translate(772 222)">
      <rect width="122" height="48" rx="12" fill="#1d193d" stroke="#a78bfa" stroke-opacity="0.72" />
      <circle class="pulse-delayed" cx="20" cy="24" r="7" fill="#a78bfa" />
      <text x="74" y="29" fill="#ede9fe" font-size="14" letter-spacing="1.2">TOOLS</text>
    </g>
    <g transform="translate(1030 218)">
      <rect width="120" height="48" rx="12" fill="#2a1738" stroke="#e879f9" stroke-opacity="0.72" />
      <circle class="pulse" cx="20" cy="24" r="7" fill="#e879f9" />
      <text x="72" y="29" fill="#fae8ff" font-size="14" letter-spacing="1.2">EVALS</text>
    </g>

    <circle class="pulse" cx="935" cy="164" r="62" fill="#8b5cf6" opacity="0.12" />
    <circle class="pulse-delayed" cx="935" cy="164" r="48" fill="#22d3ee" opacity="0.13" />
    <circle cx="935" cy="164" r="38" fill="url(#coreGradient)" opacity="0.92" filter="url(#glow)" />
    <circle cx="935" cy="164" r="29" fill="#0b1028" stroke="#f0abfc" stroke-width="1.5" />
    <text x="935" y="160" fill="#f8fafc" font-size="15" font-weight="700" letter-spacing="1.7">AGENT</text>
    <text x="935" y="180" fill="#67e8f9" font-size="10" letter-spacing="2.6">CORE</text>
  </g>

  <rect x="1" y="1" width="1198" height="318" rx="21" fill="none" stroke="url(#titleGradient)" stroke-opacity="0.55" />
</svg>
