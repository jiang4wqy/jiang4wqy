<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Jiang AI Agent Operations console</title>
  <desc id="desc">An AI Agent Operations console: identity and animated reliability, evaluation and coverage readouts on the left; a pulsing AGENT core linked to LLM, MCP, Tools and Eval nodes with flowing data packets on the right; a scanning line over a neon grid.</desc>
  <defs>
    <linearGradient id="ccBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1b" /><stop offset="0.5" stop-color="#0e1136" /><stop offset="1" stop-color="#071d2b" />
    </linearGradient>
    <linearGradient id="ccTitle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc" /><stop offset="0.5" stop-color="#c084fc" /><stop offset="1" stop-color="#22d3ee" />
    </linearGradient>
    <linearGradient id="ccBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" /><stop offset="1" stop-color="#a855f7" />
    </linearGradient>
    <radialGradient id="ccCore" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f0abfc" /><stop offset="0.45" stop-color="#8b5cf6" /><stop offset="1" stop-color="#0e7490" />
    </radialGradient>
    <pattern id="ccGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#38bdf8" stroke-opacity="0.07" />
    </pattern>
    <filter id="ccGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b" /><feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <clipPath id="ccClip"><rect x="2" y="2" width="1196" height="316" rx="18" /></clipPath>
  </defs>

  <rect x="2" y="2" width="1196" height="316" rx="18" fill="url(#ccBg)" stroke="#26365f" stroke-width="1.5" />
  <g clip-path="url(#ccClip)">
    <rect x="2" y="2" width="1196" height="316" fill="url(#ccGrid)" />
    <!-- scan line -->
    <rect x="2" width="1196" height="2" fill="#38bdf8" opacity="0.4">
      <animate attributeName="y" values="20;300;20" dur="6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.5;0" dur="6s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- LEFT: identity + readouts -->
  <text x="44" y="52" font-family="ui-monospace,monospace" font-size="14" letter-spacing="3" fill="#38bdf8">◆ JIANG · AGENT SYSTEMS</text>
  <text x="42" y="112" font-family="Verdana,'Noto Sans SC',sans-serif" font-size="46" font-weight="800" fill="url(#ccTitle)" filter="url(#ccGlow)">AI Agent</text>
  <text x="42" y="162" font-family="Verdana,'Noto Sans SC',sans-serif" font-size="46" font-weight="800" fill="url(#ccTitle)">Operations</text>

  <!-- status -->
  <circle cx="50" cy="196" r="6" fill="#34d399" filter="url(#ccGlow)">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="1.6s" repeatCount="indefinite" />
  </circle>
  <text x="64" y="201" font-family="ui-monospace,monospace" font-size="14" fill="#9fb4dc">ONLINE · build in public, contribute with evidence</text>

  <!-- readout bars -->
  <g font-family="ui-monospace,monospace" font-size="13">
    <text x="44" y="238" fill="#7dd3fc">RELIABILITY</text>
    <rect x="180" y="228" width="300" height="10" rx="5" fill="#0b1226" stroke="#1e2a4a" />
    <rect x="180" y="228" height="10" rx="5" fill="url(#ccBar)"><animate attributeName="width" values="0;294" dur="1.8s" fill="freeze" /></rect>
    <text x="492" y="238" fill="#22d3ee">98%</text>

    <text x="44" y="266" fill="#7dd3fc">EVALUATION</text>
    <rect x="180" y="256" width="300" height="10" rx="5" fill="#0b1226" stroke="#1e2a4a" />
    <rect x="180" y="256" height="10" rx="5" fill="url(#ccBar)"><animate attributeName="width" values="0;276" dur="2.0s" fill="freeze" /></rect>
    <text x="492" y="266" fill="#22d3ee">92%</text>

    <text x="44" y="294" fill="#7dd3fc">COVERAGE</text>
    <rect x="180" y="284" width="300" height="10" rx="5" fill="#0b1226" stroke="#1e2a4a" />
    <rect x="180" y="284" height="10" rx="5" fill="url(#ccBar)"><animate attributeName="width" values="0;255" dur="2.2s" fill="freeze" /></rect>
    <text x="492" y="294" fill="#22d3ee">85%</text>
  </g>

  <!-- RIGHT: agent node cluster around core (955,160) -->
  <g stroke-width="1.6" fill="none" stroke-dasharray="6 9">
    <line x1="955" y1="160" x2="885" y2="92"  stroke="#38bdf8" stroke-opacity="0.5"><animate attributeName="stroke-dashoffset" from="30" to="0" dur="1.6s" repeatCount="indefinite"/></line>
    <line x1="955" y1="160" x2="1025" y2="92" stroke="#a855f7" stroke-opacity="0.5"><animate attributeName="stroke-dashoffset" from="30" to="0" dur="1.9s" repeatCount="indefinite"/></line>
    <line x1="955" y1="160" x2="885" y2="228" stroke="#22d3ee" stroke-opacity="0.5"><animate attributeName="stroke-dashoffset" from="30" to="0" dur="1.7s" repeatCount="indefinite"/></line>
    <line x1="955" y1="160" x2="1025" y2="228" stroke="#c084fc" stroke-opacity="0.5"><animate attributeName="stroke-dashoffset" from="30" to="0" dur="2.1s" repeatCount="indefinite"/></line>
  </g>

  <!-- traveling packets -->
  <circle r="3.5" fill="#67e8f9"><animateMotion dur="1.6s" repeatCount="indefinite" path="M955,160 L885,92"/></circle>
  <circle r="3.5" fill="#d8b4fe"><animateMotion dur="1.9s" repeatCount="indefinite" path="M955,160 L1025,92"/></circle>
  <circle r="3.5" fill="#67e8f9"><animateMotion dur="1.7s" repeatCount="indefinite" path="M955,160 L885,228"/></circle>
  <circle r="3.5" fill="#d8b4fe"><animateMotion dur="2.1s" repeatCount="indefinite" path="M955,160 L1025,228"/></circle>

  <!-- nodes -->
  <g font-family="ui-monospace,monospace" font-size="13" font-weight="700">
    <g><rect x="847" y="78" width="76" height="30" rx="9" fill="#0b1226" stroke="#38bdf8" stroke-opacity="0.6"/><text x="885" y="98" text-anchor="middle" fill="#bae6fd">LLM</text></g>
    <g><rect x="987" y="78" width="76" height="30" rx="9" fill="#0b1226" stroke="#a855f7" stroke-opacity="0.6"/><text x="1025" y="98" text-anchor="middle" fill="#e9d5ff">MCP</text></g>
    <g><rect x="847" y="214" width="76" height="30" rx="9" fill="#0b1226" stroke="#22d3ee" stroke-opacity="0.6"/><text x="885" y="234" text-anchor="middle" fill="#a5f3fc">TOOLS</text></g>
    <g><rect x="987" y="214" width="76" height="30" rx="9" fill="#0b1226" stroke="#c084fc" stroke-opacity="0.6"/><text x="1025" y="234" text-anchor="middle" fill="#f0abfc">EVAL</text></g>
  </g>

  <!-- core -->
  <circle cx="955" cy="160" r="42" fill="url(#ccCore)" filter="url(#ccGlow)">
    <animate attributeName="r" values="39;45;39" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="955" y="165" text-anchor="middle" font-family="ui-monospace,monospace" font-size="15" font-weight="800" fill="#f8fafc">AGENT</text>
</svg>
