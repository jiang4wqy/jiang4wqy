<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc">
  <title id="title">Animated AI agent mission control pipeline</title>
  <desc id="desc">A continuous neon workflow connecting plan, retrieve, tool, execute, evaluate and improve stages with animated data packets.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f" />
      <stop offset="0.52" stop-color="#14113b" />
      <stop offset="1" stop-color="#07252d" />
    </linearGradient>
    <linearGradient id="flowColor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" />
      <stop offset="0.52" stop-color="#a855f7" />
      <stop offset="1" stop-color="#22d3ee" />
    </linearGradient>
    <pattern id="smallGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#7dd3fc" stroke-opacity="0.07" />
    </pattern>
    <filter id="pipelineGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#67e8f9" />
    </marker>
    <path id="mainRoute" d="M150 122 H1050" />
    <path id="loopRoute" d="M1050 153 C1040 202 170 202 150 153" />
  </defs>
  <style>
    .flow { stroke-dasharray: 9 13; animation: flow 2.5s linear infinite; }
    .loop { stroke-dasharray: 4 10; animation: reverseFlow 3.2s linear infinite; }
    .node-a { animation: nodePulse 2.4s ease-in-out infinite; }
    .node-b { animation: nodePulse 2.4s 0.4s ease-in-out infinite; }
    .node-c { animation: nodePulse 2.4s 0.8s ease-in-out infinite; }
    .status { animation: status 1.7s ease-in-out infinite; }
    @keyframes flow { to { stroke-dashoffset: -44; } }
    @keyframes reverseFlow { to { stroke-dashoffset: 42; } }
    @keyframes nodePulse { 0%,100% { opacity: 0.48; } 50% { opacity: 1; } }
    @keyframes status { 0%,100% { opacity: 0.35; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .flow,.loop,.node-a,.node-b,.node-c,.status { animation: none; } }
  </style>

  <rect width="1200" height="220" rx="20" fill="url(#panel)" />
  <rect width="1200" height="220" rx="20" fill="url(#smallGrid)" />
  <text x="40" y="38" fill="#c4b5fd" font-family="Segoe UI,Arial,sans-serif" font-size="16" letter-spacing="3">AGENT MISSION CONTROL</text>
  <circle class="status" cx="1110" cy="32" r="5" fill="#22d3ee" filter="url(#pipelineGlow)" />
  <text x="1123" y="37" fill="#a5f3fc" font-family="Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="1.8">LIVE LOOP</text>

  <use href="#mainRoute" fill="none" stroke="#0f3352" stroke-width="8" stroke-linecap="round" />
  <use class="flow" href="#mainRoute" fill="none" stroke="url(#flowColor)" stroke-width="3" marker-end="url(#arrow)" />
  <use class="loop" href="#loopRoute" fill="none" stroke="#a78bfa" stroke-opacity="0.72" stroke-width="2" />

  <g fill="#f0abfc" filter="url(#pipelineGlow)">
    <circle r="5"><animateMotion dur="4.8s" repeatCount="indefinite"><mpath href="#mainRoute" /></animateMotion></circle>
    <circle r="4"><animateMotion dur="4.8s" begin="-1.6s" repeatCount="indefinite"><mpath href="#mainRoute" /></animateMotion></circle>
    <circle r="4"><animateMotion dur="4.8s" begin="-3.2s" repeatCount="indefinite"><mpath href="#mainRoute" /></animateMotion></circle>
  </g>
  <circle r="4" fill="#22d3ee" filter="url(#pipelineGlow)">
    <animateMotion dur="5.8s" repeatCount="indefinite"><mpath href="#loopRoute" /></animateMotion>
  </circle>

  <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
    <g transform="translate(110 86)">
      <rect width="110" height="70" rx="14" fill="#0d1f3b" stroke="#38bdf8" />
      <circle class="node-a" cx="55" cy="24" r="9" fill="#38bdf8" filter="url(#pipelineGlow)" />
      <text x="55" y="52" fill="#e0f2fe" font-size="13" letter-spacing="1.2">PLAN</text>
    </g>
    <g transform="translate(290 86)">
      <rect width="120" height="70" rx="14" fill="#151b3f" stroke="#818cf8" />
      <circle class="node-b" cx="60" cy="24" r="9" fill="#818cf8" filter="url(#pipelineGlow)" />
      <text x="60" y="52" fill="#e0e7ff" font-size="13" letter-spacing="1.2">RETRIEVE</text>
    </g>
    <g transform="translate(485 86)">
      <rect width="110" height="70" rx="14" fill="#21153f" stroke="#a855f7" />
      <circle class="node-c" cx="55" cy="24" r="9" fill="#a855f7" filter="url(#pipelineGlow)" />
      <text x="55" y="52" fill="#f3e8ff" font-size="13" letter-spacing="1.2">TOOL</text>
    </g>
    <g transform="translate(670 86)">
      <rect width="120" height="70" rx="14" fill="#29143a" stroke="#e879f9" />
      <circle class="node-a" cx="60" cy="24" r="9" fill="#e879f9" filter="url(#pipelineGlow)" />
      <text x="60" y="52" fill="#fae8ff" font-size="13" letter-spacing="1.2">EXECUTE</text>
    </g>
    <g transform="translate(865 86)">
      <rect width="120" height="70" rx="14" fill="#102a3a" stroke="#22d3ee" />
      <circle class="node-b" cx="60" cy="24" r="9" fill="#22d3ee" filter="url(#pipelineGlow)" />
      <text x="60" y="52" fill="#cffafe" font-size="13" letter-spacing="1.2">EVALUATE</text>
    </g>
    <g transform="translate(1040 86)">
      <rect width="110" height="70" rx="14" fill="#102d32" stroke="#2dd4bf" />
      <circle class="node-c" cx="55" cy="24" r="9" fill="#2dd4bf" filter="url(#pipelineGlow)" />
      <text x="55" y="52" fill="#ccfbf1" font-size="13" letter-spacing="1.2">IMPROVE</text>
    </g>
  </g>

  <text x="600" y="204" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI,Arial,sans-serif" font-size="11" letter-spacing="2.4">CONTINUOUS FEEDBACK · RELIABLE EXECUTION · MEASURABLE IMPROVEMENT</text>
  <rect x="1" y="1" width="1198" height="218" rx="19" fill="none" stroke="url(#flowColor)" stroke-opacity="0.48" />
</svg>
