<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc">
  <title id="title">Jiang agent mission control pipeline</title>
  <desc id="desc">A continuous agent workflow: Plan, Retrieve, Tool, Execute, Evaluate and Improve stages connected by a flowing main route with a traveling data packet, and a return loop from Improve back to Plan.</desc>
  <defs>
    <linearGradient id="mcBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f" /><stop offset="0.52" stop-color="#0e1136" /><stop offset="1" stop-color="#07252d" />
    </linearGradient>
    <linearGradient id="mcFlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" /><stop offset="0.52" stop-color="#a855f7" /><stop offset="1" stop-color="#22d3ee" />
    </linearGradient>
    <pattern id="mcGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#7dd3fc" stroke-opacity="0.06" />
    </pattern>
    <filter id="mcGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.6" result="b" /><feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <clipPath id="mcClip"><rect x="2" y="2" width="1196" height="216" rx="18" /></clipPath>
  </defs>

  <rect x="2" y="2" width="1196" height="216" rx="18" fill="url(#mcBg)" stroke="#26365f" stroke-width="1.5" />
  <g clip-path="url(#mcClip)"><rect x="2" y="2" width="1196" height="216" fill="url(#mcGrid)" /></g>

  <text x="34" y="40" font-family="ui-monospace,monospace" font-size="14" letter-spacing="3" fill="#67e8f9">▸ AGENT MISSION CONTROL</text>
  <text x="1166" y="40" text-anchor="end" font-family="ui-monospace,monospace" font-size="12" fill="#5f719b">deterministic · observable · looping</text>

  <!-- main route -->
  <line x1="130" y1="112" x2="1080" y2="112" stroke="url(#mcFlow)" stroke-width="2.5" stroke-dasharray="9 12" opacity="0.85">
    <animate attributeName="stroke-dashoffset" from="42" to="0" dur="2.4s" repeatCount="indefinite" />
  </line>
  <!-- traveling packet on main route -->
  <circle r="5" fill="#67e8f9" filter="url(#mcGlow)">
    <animateMotion dur="4.5s" repeatCount="indefinite" path="M130,112 H1080" />
  </circle>

  <!-- return loop Improve -> Plan -->
  <path d="M1080,150 C1080,196 130,196 130,150" fill="none" stroke="#a855f7" stroke-width="1.8" stroke-opacity="0.55" stroke-dasharray="4 10">
    <animate attributeName="stroke-dashoffset" from="0" to="42" dur="3.4s" repeatCount="indefinite" />
  </path>
  <circle r="4" fill="#d8b4fe">
    <animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" path="M1080,150 C1080,196 130,196 130,150" />
  </circle>
  <text x="605" y="172" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#a78bfa">↺ improve &amp; re-run</text>

  <!-- stage chips: centers 130,320,510,700,890,1080 -->
  <g font-family="ui-monospace,monospace" font-size="15" font-weight="700">
    <g><rect x="70"  y="90" width="120" height="44" rx="12" fill="#0b1226" stroke="#38bdf8" stroke-opacity="0.6"/><text x="130"  y="117" text-anchor="middle" fill="#bae6fd">Plan</text>
       <circle cx="90" cy="112" r="3.5" fill="#38bdf8"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/></circle></g>
    <g><rect x="255" y="90" width="130" height="44" rx="12" fill="#0b1226" stroke="#22d3ee" stroke-opacity="0.6"/><text x="320"  y="117" text-anchor="middle" fill="#a5f3fc">Retrieve</text>
       <circle cx="275" cy="112" r="3.5" fill="#22d3ee"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" begin="0.4s" repeatCount="indefinite"/></circle></g>
    <g><rect x="450" y="90" width="120" height="44" rx="12" fill="#0b1226" stroke="#8b5cf6" stroke-opacity="0.6"/><text x="510"  y="117" text-anchor="middle" fill="#ddd6fe">Tool</text>
       <circle cx="470" cy="112" r="3.5" fill="#8b5cf6"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></circle></g>
    <g><rect x="638" y="90" width="124" height="44" rx="12" fill="#0b1226" stroke="#a855f7" stroke-opacity="0.6"/><text x="700"  y="117" text-anchor="middle" fill="#e9d5ff">Execute</text>
       <circle cx="658" cy="112" r="3.5" fill="#a855f7"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle></g>
    <g><rect x="825" y="90" width="130" height="44" rx="12" fill="#0b1226" stroke="#c084fc" stroke-opacity="0.6"/><text x="890"  y="117" text-anchor="middle" fill="#f0abfc">Evaluate</text>
       <circle cx="845" cy="112" r="3.5" fill="#c084fc"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" begin="1.6s" repeatCount="indefinite"/></circle></g>
    <g><rect x="1018" y="90" width="124" height="44" rx="12" fill="#0b1226" stroke="#22d3ee" stroke-opacity="0.6"/><text x="1080" y="117" text-anchor="middle" fill="#a5f3fc">Improve</text>
       <circle cx="1038" cy="112" r="3.5" fill="#22d3ee"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" begin="2s" repeatCount="indefinite"/></circle></g>
  </g>
</svg>
