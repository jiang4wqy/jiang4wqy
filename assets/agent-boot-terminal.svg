<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="title desc">
  <title id="title">Jiang agent boot terminal animation</title>
  <desc id="desc">An animated terminal booting an AI agent runtime: loading runtime, mounting MCP tools, retrieving evidence, evaluating reliability, then printing a build-in-public, contribute-with-evidence motto with a blinking cursor.</desc>
  <defs>
    <linearGradient id="bootBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1b" />
      <stop offset="0.55" stop-color="#0a1226" />
      <stop offset="1" stop-color="#071d2b" />
    </linearGradient>
    <linearGradient id="bootEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" />
      <stop offset="0.5" stop-color="#a855f7" />
      <stop offset="1" stop-color="#22d3ee" />
    </linearGradient>
    <pattern id="bootGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#38bdf8" stroke-opacity="0.06" />
    </pattern>
    <filter id="bootGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.3" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <style>
    text { font-family: "SFMono-Regular", ui-monospace, "Cascadia Code", Consolas, Menlo, monospace; }
    .line { opacity: 0; animation: appear .45s ease forwards; }
    .l0 { animation-delay: .35s; } .l1 { animation-delay: 1.15s; } .l2 { animation-delay: 1.95s; }
    .l3 { animation-delay: 2.75s; } .l4 { animation-delay: 3.55s; } .l5 { animation-delay: 4.55s; }
    .ok { fill: #34d399; font-weight: 700; } .pct { fill: #22d3ee; font-weight: 700; }
    .dim { fill: #5f719b; } .cmd { fill: #7dd3fc; } .arrow { fill: #a855f7; } .body { fill: #9fb4dc; }
    .motto { fill: #67e8f9; font-weight: 700; }
    .cur { fill: #a855f7; opacity: 0; animation: blink 1s step-end infinite; animation-delay: 5.1s; }
    .scanbar { opacity: .5; animation: sweep 6s ease-in-out infinite; }
    @keyframes appear { to { opacity: 1; } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes sweep { 0%, 100% { transform: translateY(0); opacity: 0; } 45% { opacity: .5; } 50% { transform: translateY(150px); opacity: .5; } 55% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .line { opacity: 1; animation: none; }
      .cur { opacity: 1; animation: none; }
      .scanbar { display: none; }
    }
  </style>

  <!-- window -->
  <rect x="2" y="2" width="1196" height="236" rx="16" fill="url(#bootBg)" stroke="url(#bootEdge)" stroke-width="1.5" />
  <rect x="2" y="2" width="1196" height="236" rx="16" fill="url(#bootGrid)" />

  <!-- title bar -->
  <g>
    <circle cx="34" cy="34" r="7" fill="#ff5f57" />
    <circle cx="58" cy="34" r="7" fill="#febc2e" />
    <circle cx="82" cy="34" r="7" fill="#28c840" />
    <text x="112" y="39" class="dim" font-size="15">jiang@agent — build-in-public</text>
    <text x="1168" y="39" text-anchor="end" font-size="14" class="arrow" filter="url(#bootGlow)">◐ live</text>
  </g>
  <line x1="18" y1="56" x2="1182" y2="56" stroke="#1e2a4a" stroke-width="1" />

  <!-- scan bar -->
  <rect class="scanbar" x="18" y="60" width="1164" height="2" fill="url(#bootEdge)" />

  <!-- terminal lines (explicit x per segment: renderer-independent, no inline tspan flow) -->
  <g font-size="19" letter-spacing="0.5">
    <!-- prompt -->
    <text x="30"  y="92" class="line l0 dim">$</text>
    <text x="48"  y="92" class="line l0 cmd">jiang</text>
    <text x="118" y="92" class="line l0 body">init --profile</text>
    <!-- left column steps -->
    <text x="30"  y="124" class="line l1 arrow">▸</text>
    <text x="52"  y="124" class="line l1 body">loading agent runtime .........</text>
    <text x="430" y="124" class="line l1 ok">ok</text>
    <text x="30"  y="156" class="line l2 arrow">▸</text>
    <text x="52"  y="156" class="line l2 body">mounting MCP tools ..........</text>
    <text x="430" y="156" class="line l2 ok">ok</text>
    <text x="30"  y="188" class="line l3 arrow">▸</text>
    <text x="52"  y="188" class="line l3 body">retrieving evidence ..........</text>
    <text x="430" y="188" class="line l3 ok">ok</text>
    <!-- right column steps -->
    <text x="612" y="124" class="line l4 arrow">▸</text>
    <text x="634" y="124" class="line l4 body">evaluating reliability ....</text>
    <text x="1010" y="124" class="line l4 pct">98%</text>
    <text x="612" y="156" class="line l4 arrow">▸</text>
    <text x="634" y="156" class="line l4 body">open-source PRs merged ....</text>
    <text x="1010" y="156" class="line l4 pct">7</text>
    <!-- motto -->
    <text x="30"  y="220" class="line l5 motto" filter="url(#bootGlow)">✓ build in public. contribute with evidence.</text>
    <rect class="cur" x="548" y="206" width="11" height="17" />
  </g>
</svg>
